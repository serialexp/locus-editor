name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  APP_NAME: locus-editor

jobs:
  validate-version:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag version: $VERSION"
            exit 1
          fi
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get version from Cargo.toml
        id: cargo
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Check version match
        run: |
          if [ "${{ steps.tag.outputs.VERSION }}" != "${{ steps.cargo.outputs.VERSION }}" ]; then
            echo "::error::Version mismatch! Tag version is ${{ steps.tag.outputs.VERSION }} but Cargo.toml version is ${{ steps.cargo.outputs.VERSION }}"
            echo "Please update the version in Cargo.toml to match the release tag."
            exit 1
          fi
          echo "Version check passed: ${{ steps.tag.outputs.VERSION }}"

  build-linux:
    needs: validate-version
    if: always() && (needs.validate-version.result == 'success' || needs.validate-version.result == 'skipped')
    strategy:
      matrix:
        include:
          - name: modern
            runner: ubuntu-24.04
            suffix: ""
          - name: compat
            runner: ubuntu-22.04
            suffix: "-compat"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag version: $VERSION"
            exit 1
          fi
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libgtk-3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build release binary (${{ matrix.name }})
        run: |
          cargo build --release --package locus-editor
          mkdir -p dist
          cp target/release/${{ env.APP_NAME }} dist/

          # Stage hicolor icons in the tarball under the standard
          # XDG share/icons/ layout. install.sh copies these into the
          # user's icon theme on Linux installs.
          for size in 16 32 48 64 128 256 512; do
            mkdir -p "dist/share/icons/hicolor/${size}x${size}/apps"
            cp "assets/generated/png/icon-${size}.png" \
               "dist/share/icons/hicolor/${size}x${size}/apps/${{ env.APP_NAME }}.png"
          done

          cd dist && tar -czvf ../${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-linux-x86_64${{ matrix.suffix }}.tar.gz *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.name }}
          path: |
            ${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-linux-x86_64${{ matrix.suffix }}.tar.gz

  build-macos:
    needs: validate-version
    if: always() && (needs.validate-version.result == 'success' || needs.validate-version.result == 'skipped')
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag version: $VERSION"
            exit 1
          fi
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --package locus-editor --target ${{ matrix.target }}

      - name: Create app bundle
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          APP_DIR="Locus.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"

          # Copy binary
          cp target/${{ matrix.target }}/release/${{ env.APP_NAME }} "$APP_DIR/Contents/MacOS/"

          # Build the .icns natively on the runner with Apple's own iconutil
          # rather than shipping the committed icon.icns. This guarantees a
          # valid, OS-blessed icon: iconutil + sips always emit 8-bit PNGs in
          # the exact chunk layout macOS expects. (The committed PNGs are the
          # per-size sources; sips re-encodes each to 8-bit defensively in case
          # a future regen reintroduces 16-bit output.)
          ICONSET="AppIcon.iconset"
          mkdir -p "$ICONSET"
          PNG="assets/generated/png"
          sips -s format png "$PNG/icon-16.png"   --out "$ICONSET/icon_16x16.png"      >/dev/null
          sips -s format png "$PNG/icon-32.png"   --out "$ICONSET/icon_16x16@2x.png"   >/dev/null
          sips -s format png "$PNG/icon-32.png"   --out "$ICONSET/icon_32x32.png"      >/dev/null
          sips -s format png "$PNG/icon-64.png"   --out "$ICONSET/icon_32x32@2x.png"   >/dev/null
          sips -s format png "$PNG/icon-128.png"  --out "$ICONSET/icon_128x128.png"    >/dev/null
          sips -s format png "$PNG/icon-256.png"  --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -s format png "$PNG/icon-256.png"  --out "$ICONSET/icon_256x256.png"    >/dev/null
          sips -s format png "$PNG/icon-512.png"  --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -s format png "$PNG/icon-512.png"  --out "$ICONSET/icon_512x512.png"    >/dev/null
          sips -s format png "$PNG/icon-1024.png" --out "$ICONSET/icon_512x512@2x.png" >/dev/null
          # CFBundleIconFile below references it by basename (no extension);
          # the .icns suffix is implied.
          iconutil -c icns "$ICONSET" -o "$APP_DIR/Contents/Resources/AppIcon.icns"

          # Create Info.plist
          cat > "$APP_DIR/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Locus</string>
              <key>CFBundleDisplayName</key>
              <string>Locus</string>
              <key>CFBundleIdentifier</key>
              <string>com.serialexp.locus-editor</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleExecutable</key>
              <string>locus-editor</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          ARCH=$(echo "${{ matrix.target }}" | cut -d'-' -f1)
          hdiutil create -volname "Locus" -srcfolder "Locus.app" -ov -format UDZO "${{ env.APP_NAME }}-${VERSION}-macos-${ARCH}.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: "*.dmg"

  build-windows:
    needs: validate-version
    if: always() && (needs.validate-version.result == 'success' || needs.validate-version.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag version: $VERSION"
            exit 1
          fi
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        shell: pwsh
        run: |
          cargo build --release --package locus-editor
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/release/${{ env.APP_NAME }}.exe" -Destination dist/

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath ${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-windows-x86_64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: ${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-windows-x86_64.zip

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-modern/*.tar.gz
            artifacts/linux-compat/*.tar.gz
            artifacts/macos-x86_64-apple-darwin/*.dmg
            artifacts/macos-aarch64-apple-darwin/*.dmg
            artifacts/windows-artifacts/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
