[package]
name = "vector-llm"
description = "OpenAI-compatible chat completion + SVG extraction + OS keychain storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

# Blocking HTTP. We deliberately stay off async — the editor's dialog spawns
# a dedicated worker thread per request (mirroring the trace dialog), so a
# synchronous client is the simpler fit.
reqwest = { workspace = true }

# OS-native secret store for the API key. The `secret_store` module wraps
# this so callers don't have to reach for the underlying crate.
keyring = { workspace = true }
