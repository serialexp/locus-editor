[workspace]
members = [
    "crates/vector-geom",
    "crates/vector-scene",
    "crates/vector-svg",
    "crates/vector-text",
    "crates/vector-tess",
    "crates/vector-render",
    "crates/vector-ops",
    "crates/vector-bool",
    "crates/vector-tools",
    "crates/vector-trace",
    "crates/vector-llm",
    "bin/vector-editor",
]
resolver = "2"

[workspace.package]
version = "0.5.4"
edition = "2024"
rust-version = "1.92"
authors = ["Bart"]

[workspace.dependencies]
# Math
kurbo = "0.11"
nalgebra = "0.33"

# Serialization
# `rc` feature: enable Serialize/Deserialize for Arc<T> / Rc<T> (used by
# raster image nodes — the pixel buffer is held behind an Arc so undo
# snapshots can share it cheaply).
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1"

# Cross-platform per-app config dir (~/.config/vector-editor on Linux,
# ~/Library/Application Support/vector-editor on macOS,
# %APPDATA%/vector-editor on Windows). Used for the recent-files list.
directories = "6"

# SVG
usvg = "0.47"

# Text
rustybuzz = "0.20"
ttf-parser = "0.24"
fontdb = "0.23"

# Tessellation
lyon_tessellation = "1.0"
lyon_geom = "1.0"

# Rendering
wgpu = "29"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

# GUI (egui 0.34 matches wgpu 29 + winit 0.30)
egui = "0.34"
egui-wgpu = "0.34"
egui-winit = { version = "0.34", default-features = false, features = ["x11", "clipboard"] }
egui-phosphor = "0.12"

# Utilities
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
slotmap = { version = "1.0", features = ["serde"] }

# File dialog
rfd = "0.15"

# HTTP client for the LLM crate. Blocking + rustls keeps us off async-runtime
# territory (matches the worker-thread pattern the trace dialog uses) and off
# OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Cross-platform secret store for the LLM API key. Each platform's native
# backend: macOS Keychain, Windows Credential Manager, Linux Secret Service
# (dbus). `crypto-rust` keeps us off OpenSSL on Linux for the secret-service
# session encryption.
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
    # Statically link libdbus on Linux so users (and burst CI) don't need
    # libdbus-1-dev installed at build time.
    "vendored",
] }

# Profiling. No-op by default; the `tracy` feature on `vector-editor` flips
# the backend on across all crates that declare this dep.
profiling = "1"

