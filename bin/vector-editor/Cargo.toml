[package]
name = "vector-editor"
description = "SVG/vector editor — Inkscape replacement"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
vector-geom = { path = "../../crates/vector-geom" }
vector-scene = { path = "../../crates/vector-scene" }
vector-svg = { path = "../../crates/vector-svg" }
vector-text = { path = "../../crates/vector-text" }
vector-tess = { path = "../../crates/vector-tess" }
vector-render = { path = "../../crates/vector-render" }
vector-ops = { path = "../../crates/vector-ops" }
vector-bool = { path = "../../crates/vector-bool" }
vector-tools = { path = "../../crates/vector-tools" }
vector-trace = { path = "../../crates/vector-trace" }

# Rendering + windowing
wgpu = { workspace = true }
winit = { workspace = true }
pollster = { workspace = true }

# GUI
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true }
egui-phosphor = { workspace = true }

# File dialog
rfd = { workspace = true }

# Utilities
log = { workspace = true }
env_logger = { workspace = true }
memory-stats = "1"
profiling = { workspace = true }

[build-dependencies]
# Embeds icon.rc → icon.ico into the .exe so Explorer / taskbar pick up the
# application icon. The build.rs only invokes it under cfg(target_os =
# "windows"), so on every other target this is just a small extra crate to
# compile once. Listed unconditionally (rather than under
# [target.'cfg(windows)'.build-dependencies]) because that variant keys off
# the *host* platform — it would break Linux→Windows cross-builds, where
# the host isn't Windows but the build.rs target_os check is true.
embed-resource = "3"

[features]
default = []
# Enable Tracy profiling. Run the Tracy capture UI to connect. Adds
# non-zero overhead even when no client is attached, so leave off for
# release builds.
tracy = ["profiling/profile-with-tracy"]
